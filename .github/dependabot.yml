version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directories:
      - /.github/ci/versity
      - /.github/ci/seaweedfs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
