name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify core package has no S3 client imports
        run: |
          imports=$(go list -f '{{join .Imports "\n"}}' .)
          if printf '%s\n' "$imports" | grep -Ex 'net/http|encoding/xml'; then
            echo "S3 client imports must remain in s3store" >&2
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Measure sparse search in a 10,000-document segment
        run: go test -v -run '^TestSparseSearchOnLargeSegment$' .
      - run: go test -run=^$ -fuzz=^FuzzSegmentFooter$ -fuzztime=5s -parallel=2 .
      - run: go test -run=^$ -fuzz=^FuzzSegment$ -fuzztime=5s -parallel=2 .
      - run: go test -run=^$ -fuzz=FuzzManifest -fuzztime=5s -parallel=2 .
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Formatting
        run: |
          gofmt -d . | tee /tmp/gofmt.diff
          test ! -s /tmp/gofmt.diff
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GitHub Actions lockfile tool
        run: gh extension install github/gh-actions-lock --pin v0.2.0
      - name: Verify workflow lockfile
        run: gh actions-lock --verify --no-narrow
