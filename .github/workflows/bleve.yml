name: Bleve reference
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 21 * * 0'
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        count: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('[1000,10000,100000]') || fromJSON('[1000,10000]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .data/source
          key: wiki-ja-20231101-3e1f92c-aozora-0984f7d-${{ matrix.count == 100000 && 'l' || 'sm' }}-v2
      - name: Prepare documents
        run: |
          mkdir -p .data/source
          if [ ! -s .data/source/wiki.parquet ]; then
            curl --fail --location --retry 3 --output .data/source/wiki.part 'https://huggingface.co/datasets/wikimedia/wikipedia/resolve/3e1f92c331f318af862b87e2319ed5dc26d80f5d/20231101.ja/train-00000-of-00015.parquet'
            mv .data/source/wiki.part .data/source/wiki.parquet
          fi
          extra=()
          if [ '${{ matrix.count }}' = 100000 ]; then
            if [ ! -s .data/source/wiki-1.parquet ]; then
              curl --fail --location --retry 3 --output .data/source/wiki-1.part 'https://huggingface.co/datasets/wikimedia/wikipedia/resolve/3e1f92c331f318af862b87e2319ed5dc26d80f5d/20231101.ja/train-00001-of-00015.parquet'
              mv .data/source/wiki-1.part .data/source/wiki-1.parquet
            fi
            extra=(--parquet .data/source/wiki-1.parquet)
          fi
          for name in 40_ruby_310 45630_txt_23610; do
            if [ "$name" = 40_ruby_310 ]; then author=000879; else author=000081; fi
            curl --fail --location --retry 3 --output ".data/source/$name.txt" "https://raw.githubusercontent.com/aozorahack/aozorabunko_text/0984f7dc18a2270bdfd2ff99bf14fd1b3ebb4f65/cards/$author/files/$name/$name.txt"
          done
          python -m pip install 'pyarrow==20.0.0'
          python scripts/prepare_data.py --parquet .data/source/wiki.parquet "${extra[@]}" --aozora .data/source/40_ruby_310.txt --aozora .data/source/45630_txt_23610.txt --count '${{ matrix.count }}' --out .data/generated
      - name: Build reference and record dependencies
        run: |
          mkdir -p .data/bleve
          cd experiments/blevebench
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod graph > ../../.data/bleve/graph.txt
          go list -m all > ../../.data/bleve/modules.txt
          cp go.mod go.sum ../../.data/bleve/
          go build -o ../../.data/bleve/blevebench .
          cd ../..
          stat -c '%n %s bytes' .data/bleve/blevebench > .data/bleve/binary.txt
      - name: Measure reference search
        run: |
          .data/bleve/blevebench --docs .data/generated/documents.jsonl --queries .data/generated/queries.json --index .data/bleve/index --out .data/bleve/results.json
          printf '## Bleve: %s articles\n\n```json\n' '${{ matrix.count }}' >> "$GITHUB_STEP_SUMMARY"
          cat .data/bleve/results.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n\n### Modules and binary\n\n```\n' >> "$GITHUB_STEP_SUMMARY"
          cat .data/bleve/modules.txt .data/bleve/binary.txt >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bleve-${{ matrix.count }}
          path: |
            .data/bleve/results.json
            .data/bleve/graph.txt
            .data/bleve/modules.txt
            .data/bleve/binary.txt
            .data/bleve/go.mod
            .data/bleve/go.sum
          include-hidden-files: true
          if-no-files-found: ignore
