name: S3 compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage:
    strategy:
      fail-fast: false
      matrix:
        storage: [versity, seaweedfs]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.26.10'
          cache: false
      - name: Start Versity gateway
        if: matrix.storage == 'versity'
        run: |
          docker run -d --name s3 -p 8333:7070 -e ROOT_ACCESS_KEY=testaccess -e ROOT_SECRET_KEY=testsecret -e VGW_BACKEND=posix -e VGW_BACKEND_ARGS=/tmp ghcr.io/versity/versitygw:latest
      - name: Start SeaweedFS
        if: matrix.storage == 'seaweedfs'
        run: |
          docker run -d --name s3 -p 8333:8333 chrislusf/seaweedfs:latest server -s3 -ip.bind=0.0.0.0
      - name: Wait for endpoint
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:8333/; then exit 0; fi
            sleep 2
          done
          docker logs s3
          exit 1
      - name: Exercise S3 operations
        env:
          S3_ENDPOINT: http://localhost:8333
          STORAGE: ${{ matrix.storage }}
        run: go test -v ./e2e
      - name: Diagnostics
        if: failure()
        run: docker logs s3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: s3-${{ matrix.storage }}
          path: |
            e2e/results.json
            e2e/update-results.json
          if-no-files-found: ignore
