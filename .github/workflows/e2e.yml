name: Storage compatibility
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  storage:
    strategy:
      fail-fast: false
      matrix:
        storage: [versity, seaweedfs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Start VersityGW
        if: matrix.storage == 'versity'
        run: |
          docker build -t zenbun-ci-versity .github/ci/versity
          docker run -d --name s3 -p 8333:7070 -e ROOT_ACCESS_KEY=testaccess -e ROOT_SECRET_KEY=testsecret -e VGW_BACKEND=posix -e VGW_BACKEND_ARGS=/tmp zenbun-ci-versity
      - name: Start SeaweedFS
        if: matrix.storage == 'seaweedfs'
        run: |
          docker build -t zenbun-ci-seaweedfs .github/ci/seaweedfs
          docker run -d --name s3 -p 8333:8333 zenbun-ci-seaweedfs server -s3 -ip.bind=0.0.0.0
      - name: Wait for storage
        run: |
          for ((i=0; i<60; i++)); do
            if curl -s -o /dev/null http://localhost:8333/; then exit 0; fi
            sleep 2
          done
          docker logs s3
          exit 1
      - name: Test against storage
        env:
          S3_ENDPOINT: http://localhost:8333
        run: go test -race -run TestS3EndToEnd -v ./...
      - name: Diagnostics
        if: failure()
        run: docker logs s3
  gcs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Start fake-gcs-server
        run: |
          go install github.com/fsouza/fake-gcs-server@v1.56.1
          "$(go env GOPATH)/bin/fake-gcs-server" -backend memory -scheme http -port 4443 -public-host localhost:4443 > /tmp/fake-gcs.log 2>&1 &
      - name: Wait for storage
        run: |
          for ((i=0; i<60; i++)); do
            if curl -s -o /dev/null http://localhost:4443/storage/v1/b; then exit 0; fi
            sleep 2
          done
          cat /tmp/fake-gcs.log
          exit 1
      - name: Test against storage
        env:
          GCS_ENDPOINT: http://localhost:4443
        run: go test -race -run TestGCSEndToEnd -v ./gcsstore
      - name: Diagnostics
        if: failure()
        run: cat /tmp/fake-gcs.log
