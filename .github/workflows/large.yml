name: Large corpus measurement
on:
  push:
    branches: [codex/zenbun-large-measure]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .data/source
          key: wiki-ja-20231101-3e1f92c-aozora-0984f7d-l-v2
      - name: Download pinned data
        run: |
          mkdir -p .data/source
          for n in 00000 00001; do
            if [ ! -s ".data/source/wiki-$n.parquet" ]; then
              curl --fail --location --retry 3 --output ".data/source/wiki-$n.part" "https://huggingface.co/datasets/wikimedia/wikipedia/resolve/3e1f92c331f318af862b87e2319ed5dc26d80f5d/20231101.ja/train-$n-of-00015.parquet"
              mv ".data/source/wiki-$n.part" ".data/source/wiki-$n.parquet"
            fi
          done
          for name in 40_ruby_310 45630_txt_23610; do
            if [ "$name" = 40_ruby_310 ]; then author=000879; else author=000081; fi
            curl --fail --location --retry 3 --output ".data/source/$name.txt" "https://raw.githubusercontent.com/aozorahack/aozorabunko_text/0984f7dc18a2270bdfd2ff99bf14fd1b3ebb4f65/cards/$author/files/$name/$name.txt"
          done
      - name: Prepare corpus
        run: |
          python -m pip install 'pyarrow==20.0.0'
          python scripts/prepare-corpus.py --wiki .data/source/wiki-00000.parquet --wiki .data/source/wiki-00001.parquet --aozora .data/source/40_ruby_310.txt --aozora .data/source/45630_txt_23610.txt --count 100000 --output .data/documents.jsonl
      - name: Measure and validate
        run: |
          go run ./cmd/measure --corpus .data/documents.jsonl --output .data/metrics.json
          printf '## 100,002-document measurement\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat .data/metrics.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: large-metrics
          path: .data/metrics.json
          if-no-files-found: error
