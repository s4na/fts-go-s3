name: Latency and shard experiments
on:
  pull_request:
    paths:
      - .github/workflows/latency.yml
      - internal/index/**
      - internal/tokenize/**
      - cmd/indexbench/**
      - scripts/prepare_data.py
      - go.mod
      - go.sum
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '57 18 * * 0'
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        storage: [versity, seaweedfs]
        count: [1000, 10000]
        delay: [0, 20, 50]
        shards: [16, 256, 4096]
        layout: [shards, range]
        bloom: [false, true]
        exclude:
          - shards: 16
            delay: 20
          - shards: 16
            delay: 50
          - shards: 4096
            delay: 20
          - shards: 4096
            delay: 50
          - layout: range
            delay: 20
          - layout: range
            delay: 50
          - layout: range
            shards: 16
          - layout: range
            shards: 4096
          - bloom: true
            delay: 20
          - bloom: true
            delay: 50
          - bloom: true
            layout: range
          - bloom: true
            shards: 16
          - bloom: true
            shards: 4096
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .data/source
          key: wiki-ja-20231101-3e1f92c-aozora-0984f7d-v1
      - name: Prepare sources
        run: |
          mkdir -p .data/source
          if [ ! -s .data/source/wiki.parquet ]; then
            curl --fail --location --retry 3 --output .data/source/wiki.part 'https://huggingface.co/datasets/wikimedia/wikipedia/resolve/3e1f92c331f318af862b87e2319ed5dc26d80f5d/20231101.ja/train-00000-of-00015.parquet'
            mv .data/source/wiki.part .data/source/wiki.parquet
          fi
          for name in 40_ruby_310 45630_txt_23610; do
            if [ "$name" = 40_ruby_310 ]; then author=000879; else author=000081; fi
            curl --fail --location --retry 3 --output ".data/source/$name.txt" "https://raw.githubusercontent.com/aozorahack/aozorabunko_text/0984f7dc18a2270bdfd2ff99bf14fd1b3ebb4f65/cards/$author/files/$name/$name.txt"
          done
          python -m pip install 'pyarrow==20.0.0'
          python scripts/prepare_data.py --parquet .data/source/wiki.parquet --aozora .data/source/40_ruby_310.txt --aozora .data/source/45630_txt_23610.txt --count '${{ matrix.count }}' --out .data/generated
      - name: Start Versity
        if: matrix.storage == 'versity'
        run: docker run -d --name s3 -p 8333:7070 -e ROOT_ACCESS_KEY=testaccess -e ROOT_SECRET_KEY=testsecret -e VGW_BACKEND=posix -e VGW_BACKEND_ARGS=/tmp ghcr.io/versity/versitygw:latest
      - name: Start SeaweedFS
        if: matrix.storage == 'seaweedfs'
        run: docker run -d --name s3 -p 8333:8333 chrislusf/seaweedfs:latest server -s3 -ip.bind=0.0.0.0
      - name: Wait for storage
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:8333/; then exit 0; fi
            sleep 2
          done
          docker logs s3
          exit 1
      - name: Configure Toxiproxy
        run: |
          docker run -d --name proxy --network host --platform linux/amd64 ghcr.io/shopify/toxiproxy:2.12.0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8474/version; then break; fi
            sleep 1
          done
          curl --fail -X POST -H 'Content-Type: application/json' http://127.0.0.1:8474/proxies -d '{"name":"s3","listen":"127.0.0.1:8666","upstream":"127.0.0.1:8333"}'
          if [ '${{ matrix.delay }}' != 0 ]; then
            curl --fail -X POST -H 'Content-Type: application/json' http://127.0.0.1:8474/proxies/s3/toxics -d '{"name":"latency","type":"latency","stream":"upstream","attributes":{"latency":${{ matrix.delay }},"jitter":0}}'
          fi
      - name: Measure build and search
        env:
          S3_ENDPOINT: http://127.0.0.1:8333
          S3_SEARCH_ENDPOINT: http://127.0.0.1:8666
        run: |
          go run ./cmd/indexbench --docs .data/generated/documents.jsonl --queries .data/generated/queries.json --shards '${{ matrix.shards }}' --layout '${{ matrix.layout }}' --bloom='${{ matrix.bloom }}' --out .data/experiment.json
          printf '## %s: %s documents, %s shards, %s layout, bloom=%s, %s ms upstream toxic\n\n```json\n' '${{ matrix.storage }}' '${{ matrix.count }}' '${{ matrix.shards }}' '${{ matrix.layout }}' '${{ matrix.bloom }}' '${{ matrix.delay }}' >> "$GITHUB_STEP_SUMMARY"
          cat .data/experiment.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: latency-${{ matrix.storage }}-${{ matrix.count }}-${{ matrix.shards }}-${{ matrix.delay }}-${{ matrix.layout }}-${{ matrix.bloom }}
          path: .data/experiment.json
          include-hidden-files: true
          if-no-files-found: ignore
