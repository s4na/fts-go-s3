name: Dataset and oracle
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 18 * * 0'
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        count: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('[1000,10000,100000]') || fromJSON('[1000,10000]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .data/source
          key: wiki-ja-20231101-3e1f92c-aozora-0984f7d-v1
      - name: Download sources
        run: |
          mkdir -p .data/source
          if [ ! -s .data/source/wiki.parquet ]; then
            curl --fail --location --retry 3 --output .data/source/wiki.part 'https://huggingface.co/datasets/wikimedia/wikipedia/resolve/3e1f92c331f318af862b87e2319ed5dc26d80f5d/20231101.ja/train-00000-of-00015.parquet'
            mv .data/source/wiki.part .data/source/wiki.parquet
          fi
          for name in 40_ruby_310 45630_txt_23610; do
            if [ "$name" = 40_ruby_310 ]; then author=000879; else author=000081; fi
            curl --fail --location --retry 3 --output ".data/source/$name.txt" "https://raw.githubusercontent.com/aozorahack/aozorabunko_text/0984f7dc18a2270bdfd2ff99bf14fd1b3ebb4f65/cards/$author/files/$name/$name.txt"
          done
      - name: Convert dataset
        run: |
          python -m pip install 'pyarrow==20.0.0'
          python scripts/prepare_data.py --parquet .data/source/wiki.parquet --aozora .data/source/40_ruby_310.txt --aozora .data/source/45630_txt_23610.txt --count '${{ matrix.count }}' --out .data/generated
      - name: Run oracle
        run: |
          go run ./cmd/oraclebench --docs .data/generated/documents.jsonl --queries .data/generated/queries.json --out .data/results.json | tee .data/summary.txt
          printf '## Oracle: %s Wikipedia articles + 2 Aozora works\n\n' '${{ matrix.count }}' >> "$GITHUB_STEP_SUMMARY"
          cat .data/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Record dependency graph
        run: |
          printf '\n### Go module graph\n\n```\n' >> "$GITHUB_STEP_SUMMARY"
          go mod graph >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: oracle-${{ matrix.count }}
          path: |
            .data/results.json
            .data/generated/queries.json
          include-hidden-files: true
          if-no-files-found: ignore
